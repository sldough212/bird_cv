# ==========================================================================
# BirdCV Pipeline Configuration
# ==========================================================================
# Fields with no default in the dataclass are REQUIRED — fill them in below.
# Fields with a default are OPTIONAL — shown here with their default value;
# delete or comment out any you don't want to override.
#
# NOTE: fields marked `init=False` in the dataclasses (e.g. path_to_training_data,
# path_to_output, and all the derived paths on BirdCVConfig) are computed
# automatically in __post_init__ and should NOT be set here.
# ==========================================================================

# ---- Core paths (required) ----
# Every new-pipeline run lives here, by RUN_ID (see bird_cv/core/layout.py).
# The Label Studio pre-labeling pipelines also derive their media paths from
# it; their existing media is under full_pipeline/20260817.
path_to_base_output = "/gscratch/pdoughe1/full_pipeline/pipeline_run"
# Raw videos, {camera}/{video}.{ext}: inference standardizes them and prepare
# computes expected standardized frame counts from their headers. Check with
# `python bird_cv/pipelines/check_fps.py CONFIG` (the value below is the 900-frame
# standardized set, which also works: 15 fps and at most 900 frames).
path_to_raw_videos = "/gscratch/pdoughe1/videos/2021_bunting_clips"
path_to_segmentation_configs = "/gscratch/pdoughe1/segmentation_configs/configs"
sam_model_id = "facebook/sam2.1-hiera-large"
# Frame rate every raw video is standardized to; canonical frames index it.
# standard_fps = 15

# ---- Label Studio (required) ----
# api_key is read from the LABEL_STUDIO_API_KEY environment variable.
# A value here still works as a fallback, but never commit one.
detect_project_name = "Detect"
classify_project_name = "Classify"


[detect]
# ---- Required ----
# Duplicated in [models.detector] for the new pipelines; this copy is for the legacy ones.
path_to_yolo = "/gscratch/pdoughe1/full_pipeline/20260817/detect/output/20260901_011549/bird_yolo/weights/best.pt"
path_to_yolo_config = "/home/pdoughe1/bird_cv/bird_cv/detection/detect_birds.yaml"
# Duplicated in [models.detector] for the new pipelines; this copy is for the legacy ones.
path_to_tracker_config = "/home/pdoughe1/bird_cv/bird_cv/detection/tracker.yaml"

# ---- Optional (defaults shown) ----
epochs = 60
device = 0
tune = false
tune_iterations = 50
run_name = "bird_yolo"


[classify]
# ---- Required ----
# Duplicated in [models.classifier] for the new pipelines; this copy is for the legacy ones.
path_to_mae = "/gscratch/pdoughe1/20260415_163412/training/videomae_behavior/best"

# ---- Optional (defaults shown) ----
# Legacy pipelines only; new ones use [models.classifier] options.num_frames.
num_frames = 16
epochs = 50
batch_size = 8
lr = 1e-4
device = "cuda"
freeze_encoder = true



# ---- Dataset preparation (optional; defaults in comments) ----
[prepare]
# Relabeler applied to the Classify export before ground truth
# (bird_cv/preprocessing/relabel.py): "identity" keeps the Classify labels,
# "activity_groups" groups them into awake / restful / restless. Its classes
# are the class vocabulary; a new scheme gets its own split (ADR 0008).
# relabel_options are the relabeler's fields.
relabel = "activity_groups"
relabel_options = { head_move_restful_max_frames = 15 }
# Fraction of cameras per split; sizes a new scheme's first split.
split_ratio = { train = 0.6, val = 0.2, test = 0.2 }
# split_seed = 42
# yolo_uniform_stride = 5
# videomae_clip_stride = 8
# standardized_max_frames = 900

# ---- Training runs (optional; defaults shown) ----
[train]
# device = 0

# ---- Models ----
# Each role table picks a model by `kind` (see bird_cv/training/registry.py)
# for both training and inference, and overrides only the keys it sets; the
# commented keys show the defaults. A role's `kind` picks its
# [models.<role>.<kind>] subtable, merged onto the role's shared keys; a kind
# other than the default starts from scratch and must set `pretrained`. `options` apply to every training run of
# the role; `tune_options` only to the tuner; `infer_options` to the inference
# model. `checkpoint` (absolute) is what infer.py loads when it isn't given
# --train-run-id. Training data, runs and every other output path come from
# bird_cv/core/layout.py. options.num_frames of the classifier is also the
# clip length prepare samples.

[models.detector]
# "yolo" or "rfdetr": the only line to change to swap detectors. Keys here are
# shared; [models.detector.<kind>] holds each kind's own (ADR 0010).
kind = "yolo"
# Both kinds track with this Ultralytics tracker config.
infer_options = { tracker_path = "/home/pdoughe1/bird_cv/bird_cv/detection/tracker.yaml" }

[models.detector.yolo]
# Duplicated in [detect] path_to_yolo / path_to_tracker_config for the legacy
# pipelines; these copies are for the new ones. Smoke-test weights (ADR 0004).
checkpoint = "/gscratch/pdoughe1/full_pipeline/20260817/detect/output/20260901_011549/bird_yolo/weights/best.pt"
# YoloDetector fields: tracker_path (required), conf, iou, max_det
# infer_options = {}
# pretrained = "yolo11n.pt"
# epochs = 60
# tune = false
# tune_trials = 30
# # Empty means Ultralytics' default Ray Tune space.
# search_space = {}
# # Ultralytics training arguments, e.g. { imgsz = 640 }
# options = {}
# # Ultralytics run_ray_tune arguments, e.g. { grace_period = 10 }
# tune_options = {}

[models.detector.rfdetr]
# An rfdetr model class (Apache-2.0 sizes: RFDETRNano, RFDETRSmall,
# RFDETRMedium, RFDETRLarge). Trains on the yolo dataset; no tuning.
pretrained = "RFDETRSmall"
epochs = 50
tune = false
# rfdetr model.train arguments, e.g. resolution, lr, early_stopping
options = { batch_size = 8, grad_accum_steps = 2 }
# RfdetrDetector fields: tracker_path (required), threshold (keep under the
# tracker's track_low_thresh), batch_size
infer_options = { threshold = 0.05 }
# checkpoint = "/abs/path/checkpoint_best_total.pth"

[models.classifier]
# Duplicated in [classify] path_to_mae for the legacy pipelines; this copy is
# for the new ones. Smoke-test weights (ADR 0004).
checkpoint = "/gscratch/pdoughe1/20260415_163412/training/videomae_behavior/best"
