# ==========================================================================
# BirdCV Pipeline Configuration
# ==========================================================================
# Fields with no default in the dataclass are REQUIRED — fill them in below.
# Fields with a default are OPTIONAL — shown here with their default value;
# delete or comment out any you don't want to override.
#
# NOTE: fields marked `init=False` in the dataclasses (e.g. path_to_training_data,
# path_to_output, and all the derived paths on BirdCVConfig) are computed
# automatically in __post_init__ and should NOT be set here.
# ==========================================================================

# ---- Core paths (required) ----
path_to_base_output = "/gscratch/pdoughe1/full_pipeline/20260817"
path_to_raw_videos = "/gscratch/pdoughe1/videos/2021_bunting_clips_standardized"
path_to_segmentation_configs = "/gscratch/pdoughe1/segmentation_configs/configs"
sam_model_id = "facebook/sam2.1-hiera-large"

# ---- Label Studio (required) ----
# api_key is read from the LABEL_STUDIO_API_KEY environment variable.
# A value here still works as a fallback, but never commit one.
detect_project_name = "Detect"
classify_project_name = "Classify"


[detect]
# ---- Required ----
# Duplicated in [train.detector] for the new pipelines; this copy is for the legacy ones.
path_to_yolo = "/gscratch/pdoughe1/full_pipeline/20260817/detect/output/20260901_011549/bird_yolo/weights/best.pt"
path_to_yolo_config = "/home/pdoughe1/bird_cv/bird_cv/detection/detect_birds.yaml"
# Duplicated in [train.detector] for the new pipelines; this copy is for the legacy ones.
path_to_tracker_config = "/home/pdoughe1/bird_cv/bird_cv/detection/tracker.yaml"

# ---- Optional (defaults shown) ----
epochs = 60
device = 0
tune = false
tune_iterations = 30
run_name = "bird_yolo"


[classify]
# ---- Required ----
# Duplicated in [train.classifier] for the new pipelines; this copy is for the legacy ones.
path_to_mae = "/gscratch/pdoughe1/20260415_163412/training/videomae_behavior/best"

# ---- Optional (defaults shown) ----
num_frames = 16
epochs = 10
batch_size = 8
lr = 1e-4
device = "cuda"
freeze_encoder = true



# ---- Models ----
# Each role table picks a model by `kind` (see bird_cv/training/registry.py)
# for both training and inference, and overrides only the keys it sets; the
# commented keys show the defaults. A table that changes `kind` starts from
# scratch and must set `pretrained`. `options` apply to every training run of
# the role; `tune_options` only to the tuner; `infer_options` to the inference
# model. `checkpoint` (absolute) is what infer.py loads when it isn't given
# --train-run-id. Training data, runs and every other output path come from
# bird_cv/core/layout.py.

[train]
# device = 0

[train.detector]
# Duplicated in [detect] path_to_yolo / path_to_tracker_config for the legacy
# pipelines; these copies are for the new ones. Smoke-test weights (ADR 0004).
checkpoint = "/gscratch/pdoughe1/full_pipeline/20260817/detect/output/20260901_011549/bird_yolo/weights/best.pt"
# YoloDetector fields: tracker_path (required), conf, iou, max_det
infer_options = { tracker_path = "/home/pdoughe1/bird_cv/bird_cv/detection/tracker.yaml" }
