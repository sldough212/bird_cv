# Activity groups + VideoMAE on whole cage frames (no detector).
# Fresh run from generic pretrained weights (ADR 0004):
#   CONFIG=bird_cv/pipelines/configs/experiments/THIS.toml bash slurm_scripts/submit.sh
# Every experiment shares path_to_base_output, so prepare links a run to an
# existing dataset with the same key instead of rebuilding it (ADR 0006).
# config.toml documents every key; only what this experiment needs is set.

path_to_base_output = "/gscratch/pdoughe1/full_pipeline/pipeline_run"
path_to_raw_videos = "/gscratch/pdoughe1/videos/2021_bunting_clips"
path_to_segmentation_configs = "/gscratch/pdoughe1/segmentation_configs/configs"
sam_model_id = "facebook/sam2.1-hiera-large"
detect_project_name = "Detect"
classify_project_name = "Classify"

# Required by the legacy Label Studio pipelines only; unused here.
[detect]
path_to_yolo = "/gscratch/pdoughe1/full_pipeline/20260817/detect/output/20260901_011549/bird_yolo/weights/best.pt"
path_to_yolo_config = "/home/pdoughe1/bird_cv/bird_cv/detection/detect_birds.yaml"
path_to_tracker_config = "/home/pdoughe1/bird_cv/bird_cv/detection/tracker.yaml"

[classify]
path_to_mae = "/gscratch/pdoughe1/20260415_163412/training/videomae_behavior/best"

[prepare]
relabel = "activity_groups"
relabel_options = { head_move_restful_max_frames = 15 }
split_ratio = { train = 0.6, val = 0.2, test = 0.2 }

[models.classifier]
kind = "videomae"

[models.classifier.videomae]
# Whole cage frames, no detector role (ADR 0009). options replaces the
# default table, so num_frames and batch_size are repeated.
options = { num_frames = 16, batch_size = 8, input = "cage" }


